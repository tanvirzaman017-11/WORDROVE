name: Build & Distribute Android APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant to compile'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare Environment Files
        run: |
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi
          chmod +x gradlew || true

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build Debug APK
        if: "${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == '' }}"
        run: |
          gradle assembleDebug --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (if selected)
        if: "${{ github.event.inputs.build_type == 'release' }}"
        run: |
          gradle assembleRelease --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace

      - name: Verify & List Built APKs
        run: |
          echo "=== Built APK files ==="
          find app/build/outputs/apk -name "*.apk" || true

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vanguard-Wardrobe-APK
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/**/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

